apply plugin: 'com.android.application'

static def getBuildId() {
    def buildId = System.getenv("BUILD_VERSION") ?: ""
    if (!"".equals(buildId))
        buildId = "-" + buildId
    return buildId
}

android {
    signingConfigs {
        release {
            //
        }
    }

    compileSdkVersion 28

    defaultConfig {
        applicationId "com.seuic.uhfdemo"
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 69
        versionName "1.6.19"
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.release
        }
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            //signingConfig signingConfigs.release
        }
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    android.applicationVariants.all {
        variant ->
            variant.outputs.all {
                //
                outputFileName = "UHFDemo" + "-v" + defaultConfig.versionName + getBuildId() + ".apk"
            }
    }
}

dependencies {
    compileOnly files('libs/scankey.jar')
    compileOnly files('libs/uhf.jar')
    implementation 'com.android.support:support-compat:28.0.0'
    implementation 'com.android.support:support-core-utils:28.0.0'

    implementation 'com.android.support:support-core-ui:28.0.0'
    implementation 'com.android.support:support-media-compat:28.0.0'
    implementation 'com.android.support:support-fragment:28.0.0'

    implementation 'org.greenrobot:eventbus:3.1.1'
    implementation 'com.squareup.okhttp3:okhttp:3.3.1'
    implementation 'com.squareup.okio:okio:1.8.0'
}
